name: SafariProfileGuard
options:
  bundleIdPrefix: com.nilsel
  deploymentTarget:
    macOS: "13.0"
targets:
  SafariProfileGuard:
    type: application
    platform: macOS
    sources:
      - path: Sources/SafariProfileGuard
      - path: AppIcon.icns
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        LSUIElement: true
        NSAccessibilityUsageDescription: "SafariProfileGuard needs Accessibility access to see which Safari profile a new window is using, and to switch it when you ask it to."
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nilsel.SafariProfileGuard
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ENABLE_APP_SANDBOX: false
